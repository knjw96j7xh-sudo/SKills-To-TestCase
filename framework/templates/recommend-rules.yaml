# 检查点推荐规则（可按项目修改）
# 复制到 .testcase-assets/recommend-rules.yaml 后生效；缺失时使用内置默认。

# 推荐上限
max_recommend: 15

# 业务域 / 分类关键词 → 优先匹配检查点编号前缀或分类名中的字样
domain_keywords:
  列表: ["LIST", "列表", "分页", "筛选", "搜索"]
  文件: ["FILE", "上传", "下载", "附件", "预览"]
  风险: ["RISK", "并发", "权限", "越权", "超时"]
  接口: ["API", "鉴权", "幂等", "参数"]
  用户: ["UC", "登录", "注册", "验证码"]

# 设计/需求信号词 → 倾向的检查点前缀
design_signals:
  分页: ["LIST"]
  上传: ["FILE"]
  下载: ["FILE"]
  权限: ["RISK"]
  角色: ["RISK", "UC"]
  并发: ["RISK"]
  接口: ["API"]
  表单: ["UC", "LIST"]
  导出: ["FILE", "LIST"]

# 历史复用：目录名别名（模块口语 → 匹配 history 目录关键字）
module_alias:
  组织树: ["组织", "架构树", "组织树"]
  绩效: ["绩效", "评价"]
